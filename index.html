            async function userguest(){
              try{
                let response = await fetch("persons.JSON");
                if (!response.ok){
                  throw new Error("failed to fetch data");
                }
                let data = await response.json()
                let users = document.getElementById("username");
                users.innerHTML= " ";
                data.forEach(user => {
                  let p = document.createElement("p");
                  p.textContent= user.name + "-" + user.age + "-" + user.class;
                  users.appendChild(p)
                  
                });
              }
              catch(error){
                console.log('error',error);
              }
            }
